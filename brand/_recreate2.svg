<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" fill="none">
  <defs>
    <!-- P + house monoline, v2: bigger rounded bowl, house nested in lower counter -->
    <g id="m" stroke="#B85C38" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- P stem -->
      <path d="M29 16 L29 88"/>
      <!-- P bowl (large rounded loop, top ~62%) -->
      <path d="M29 16 L54 16 A23 23 0 0 1 54 62 L29 62"/>
      <!-- house roof nested under the bowl -->
      <path d="M33 70 L46 59 L59 70"/>
      <!-- house door -->
      <path d="M42 88 L42 77 L50 77 L50 88"/>
    </g>
    <g id="mC" stroke="#FAF7F2" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 16 L29 88"/>
      <path d="M29 16 L54 16 A23 23 0 0 1 54 62 L29 62"/>
      <path d="M33 70 L46 59 L59 70"/>
      <path d="M42 88 L42 77 L50 77 L50 88"/>
    </g>
  </defs>

  <rect width="900" height="360" fill="#FAF7F2"/>
  <text x="40" y="40" font-family="Georgia,serif" font-size="13" letter-spacing="2" fill="#9C9286">RECREATION v2 — P + HOUSE</text>

  <!-- big mark on cream -->
  <g transform="translate(60,70)"><g transform="scale(2.2)"><use href="#m"/></g></g>

  <!-- mark on ink + favicon sizes -->
  <g transform="translate(380,70)">
    <rect width="180" height="180" rx="40" fill="#1A1714"/>
    <g transform="translate(36,36) scale(1.08)"><use href="#mC"/></g>
  </g>
  <g transform="translate(610,86)">
    <g transform="scale(1.2)"><use href="#m"/></g>
    <g transform="translate(140,22) scale(0.6)"><use href="#m"/></g>
    <g transform="translate(220,40) scale(0.34)"><use href="#m"/></g>
    <text x="0" y="150" font-family="Georgia,serif" font-size="12" letter-spacing="1.5" fill="#9C9286">120 / 60 / 32 px</text>
  </g>

  <!-- lockup -->
  <g transform="translate(60,250)">
    <g transform="scale(1.05)"><use href="#m"/></g>
    <text x="125" y="78" font-family="Georgia,serif" font-size="58" letter-spacing="-0.8"><tspan fill="#1A1714">Prop</tspan><tspan fill="#B85C38">Drive</tspan></text>
  </g>
</svg>
