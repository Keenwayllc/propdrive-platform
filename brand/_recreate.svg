<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" fill="none">
  <defs>
    <!-- P + house monoline mark, drawn in a 100x100 box -->
    <g id="mark" stroke="#B85C38" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <!-- P stem -->
      <path d="M31 20 L31 84"/>
      <!-- P bowl -->
      <path d="M31 20 L57 20 A19 19 0 0 1 57 58 L31 58"/>
      <!-- house roof -->
      <path d="M21 72 L35 60 L49 72"/>
      <!-- house door -->
      <path d="M30 84 L30 73 L40 73 L40 84"/>
    </g>
    <g id="markInk" stroke="#1A1714" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 20 L31 84"/>
      <path d="M31 20 L57 20 A19 19 0 0 1 57 58 L31 58"/>
      <path d="M21 72 L35 60 L49 72"/>
      <path d="M30 84 L30 73 L40 73 L40 84"/>
    </g>
    <g id="markCream" stroke="#FAF7F2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 20 L31 84"/>
      <path d="M31 20 L57 20 A19 19 0 0 1 57 58 L31 58"/>
      <path d="M21 72 L35 60 L49 72"/>
      <path d="M30 84 L30 73 L40 73 L40 84"/>
    </g>
  </defs>

  <rect width="1000" height="380" fill="#FAF7F2"/>

  <!-- Primary lockup -->
  <g transform="translate(60,70)">
    <g transform="scale(2.0)"><use href="#mark"/></g>
    <text x="250" y="148" font-family="Georgia, serif" font-size="96" letter-spacing="-1">
      <tspan fill="#1A1714">Prop</tspan><tspan fill="#B85C38">Drive</tspan>
    </text>
  </g>

  <!-- On ink -->
  <g transform="translate(660,250)">
    <rect x="-20" y="-30" width="320" height="120" rx="18" fill="#1A1714"/>
    <g transform="translate(0,0) scale(1.0)"><use href="#markCream"/></g>
    <text x="118" y="74" font-family="Georgia, serif" font-size="40" letter-spacing="-0.5"><tspan fill="#FAF7F2">Prop</tspan><tspan fill="#B85C38">Drive</tspan></text>
  </g>

  <!-- favicon sizes -->
  <g transform="translate(60,250)">
    <g transform="scale(0.9)"><use href="#mark"/></g>
    <g transform="translate(110,18) scale(0.5)"><use href="#mark"/></g>
    <g transform="translate(180,30) scale(0.32)"><use href="#mark"/></g>
    <text x="0" y="120" font-family="Georgia, serif" font-size="13" letter-spacing="1.5" fill="#9C9286">MARK · 90 / 50 / 32 px</text>
  </g>
</svg>
